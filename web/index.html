<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PizzaGo — Order pizza</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍕%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#333;--head:#1b2733;--muted:#6c757d;--line:#e3e7eb;--blue:#2196F3;--blue2:#1976D2;--green:#4CAF50;--red:#c62828;--soft:#e8f3fe;--map:#e8eef3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12171c;--card:#1b232b;--text:#dbe2e8;--head:#f1f5f9;--muted:#9aa7b3;--line:#2b3640;--soft:#16324a;--map:#232d37;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}body{font:15px/1.45 'Segoe UI','Helvetica Neue',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
#app{display:flex;min-height:100vh}
aside{width:268px;background:var(--card);border-right:1px solid var(--line);padding:22px 0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:0 24px 14px;font-size:22px;font-weight:800;color:var(--blue2)}
.logo{width:40px;height:40px}
.rail{flex:1;padding:6px 24px;overflow:auto}
.st{display:flex;gap:14px;position:relative;padding-bottom:30px;cursor:default}
.st:not(:last-child)::before{content:"";position:absolute;left:14px;top:32px;bottom:2px;width:3px;border-radius:3px;background:var(--line)}
.st.done:not(:last-child)::before{background:var(--green)}
.dot{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--line);color:var(--muted);border:2px solid var(--line)}
.st.done .dot{background:var(--green);border-color:var(--green);color:#fff;cursor:pointer}
.st.cur .dot{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 0 5px rgba(33,150,243,.2)}
.st b{display:block;font-weight:500}.st.cur b{font-weight:700;color:var(--head)}.st small{color:var(--muted);font-size:12px}
.acct{margin:0 14px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:13px}
main{flex:1;min-width:0;padding:40px 44px 60px}.wrap{max-width:1040px;margin:0 auto}
h1{margin:0 0 4px;font-size:30px;font-weight:800;color:var(--head)}.sub{color:var(--muted);margin:0 0 22px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 26px;margin-bottom:20px}
.card h3{margin:0 0 14px;font-size:16px;color:var(--head)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px 20px;font-weight:600}
button:hover{border-color:var(--blue)}button:disabled{opacity:.5;cursor:default}
.pri{background:var(--green);border:0;color:#fff;font-weight:700;padding:13px 28px;font-size:15px}.pri:hover{background:#43a047}
.danger{color:var(--red);border-color:#e57373}.link{border:0;background:none;color:var(--blue2);padding:2px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:6px}
input,select{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text)}
input:focus,select:focus{outline:2px solid var(--blue);border-color:transparent}
label.f{display:block;font-size:13px;font-weight:600;margin:0 0 6px;color:var(--muted)}.fld{margin-bottom:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.opt{text-align:left;border:2px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--card);font-weight:500;min-height:78px}
.opt.on{border-color:var(--blue);background:var(--soft)}.opt small{display:block;color:var(--muted);font-weight:400}
.seg{display:inline-flex}.seg button{border-radius:0;margin-right:-1px}.seg button:first-child{border-radius:10px 0 0 10px}.seg button:last-child{border-radius:0 10px 10px 0}
.seg button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.err{background:#fdecea;color:var(--red);border-radius:8px;padding:10px 12px;font-weight:600;margin:10px 0;display:none}
.note{color:var(--muted);font-size:13px}.ok{color:#2e7d32;font-weight:600}
.hero{background:linear-gradient(135deg,#42A5F5,#1565C0);color:#fff;border-radius:20px;padding:34px;flex:0 0 310px}
.hero h2{font-size:34px;margin:14px 0 8px}.hero p{margin:6px 0}
.row{display:flex;gap:26px;flex-wrap:wrap}.row>*{flex:1 1 300px}
.chk{display:flex;gap:8px;align-items:center;padding:6px 2px}.chk input{width:18px;height:18px}
.rest{display:flex;gap:12px;align-items:center;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.rest.on{border-color:var(--blue);background:var(--soft)}.rest i{width:42px;height:42px;border-radius:50%;background:#ff6600;flex:none;display:grid;place-items:center;font-style:normal}
svg.map{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);display:block}
.pin{cursor:pointer}
table{width:100%;border-collapse:collapse}td{padding:3px 0}td:last-child{text-align:right}
.tl{display:flex;gap:12px;margin-bottom:10px}.tl .d{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--muted);font-weight:700;flex:none;font-size:13px}
.tl.done .d{background:var(--green);color:#fff}.tl.cur .d{background:var(--blue);color:#fff}.tl.cur b{color:var(--head)}.tl small{color:var(--muted);display:block}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green));width:0}
.eta{font-size:32px;font-weight:800;color:var(--head)}.star{font-size:30px;color:#f5a623;border:0;background:none;padding:0 3px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#263238;color:#fff;padding:10px 18px;border-radius:10px;display:none}
@media(max-width:860px){#app{flex-direction:column}aside{width:100%;height:auto;position:static;padding:12px 0}.rail{display:flex;gap:14px;padding:6px 16px;overflow-x:auto}.st{padding:0;flex:none}.st::before{display:none!important}.st small,.acct{display:none}main{padding:22px 16px 50px}.g3,.g2{grid-template-columns:1fr}.hero{flex:1 1 100%}}
</style></head><body>
<div id="app">
<aside><div class="brand"><svg class="logo" viewBox="0 0 40 40"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#42A5F5"/><stop offset="1" stop-color="#1976D2"/></linearGradient></defs><rect width="40" height="40" rx="10" fill="url(#lg)"/><path d="M9 13h22L20 34z" fill="#FFD54F"/><rect x="7" y="9" width="26" height="5" rx="2.5" fill="#E6A23C"/><circle cx="16.5" cy="19" r="2.2" fill="#E53935"/><circle cx="23.5" cy="19" r="2.2" fill="#E53935"/><circle cx="20" cy="25" r="2" fill="#E53935"/></svg>PizzaGo</div>
<div class="rail" id="rail"></div><div class="acct" id="acct"></div></aside>
<main><div class="wrap" id="view"></div></main></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),money=v=>'$'+v.toFixed(2),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STEPS=[['Sign in','Log in or continue as guest'],['Choose restaurant','Pick a spot on the map'],['Build your pizza','Size, crust & toppings'],['Delivery details','Where should we deliver?'],['Payment','Card, wallet, cash…'],['Review & confirm','Check & add promo code'],['Order tracking','Follow your pizza live']];
const REST=[{n:'Pizza Pizza — Peanut Plaza',a:'Don Mills Rd & Sheppard Ave E',h:'Open until 11:00 PM',x:420,y:330,r:4.6,f:2.99,km:.9,e:22},{n:'Pizza Hut — 3555 Don Mills Rd',a:'3555 Don Mills Rd',h:'Open until 12:00 AM',x:420,y:250,r:4.3,f:3.49,km:.8,e:21},{n:'Pizza Hot Wings — 3883 Don Mills Rd',a:'3883 Don Mills Rd',h:'Open until 1:00 AM',x:420,y:110,r:4.4,f:3.99,km:2.5,e:28},{n:'Pizza Pizza — 5921 Leslie St',a:'5921 Leslie St',h:'Open until 11:30 PM',x:150,y:230,r:4.5,f:2.49,km:1.4,e:24}];
const TOPS=[['Pepperoni','🔴'],['Ham','🥓'],['Beef','🥩'],['Green Pepper','🫑'],['Mushroom','🍄'],['Pineapple','🍍'],['Onion','🧅'],['Olives','🫒'],['Artichokes','🥬'],['Extra Sauce','🥫']];
const PRE=[['✨','Start from scratch','Pick every topping yourself',[]],['🧀','Margherita','Classic cheese & sauce',[]],['🍕','Pepperoni Classic','Loaded with pepperoni',['Pepperoni']],['🥬','Veggie Delight','Peppers, mushroom, onion, olives',['Green Pepper','Mushroom','Onion','Olives']],['🍍','Hawaiian','Ham & pineapple',['Ham','Pineapple']],['🥩','Meat Lovers','Pepperoni, ham & beef',['Pepperoni','Ham','Beef']]];
const SIZES=[['Small',8.99],['Medium',10.99],['Large',12.99]],CRUSTS=[['Regular',0],['Thin',0],['Stuffed',2],['Gluten-free',2.5]],TIPS=[0,10,15,20];
const PAY=['💳 Card','🍎 Apple Pay','📱 Google Pay','🅿️ PayPal','💵 Cash','🎁 Gift card'];
const STAGES=[['Order received','The restaurant has your order','📝',0],['Preparing your order','Rolling dough and adding toppings','🔥',.08],['Baking','In the oven — about 10 minutes','🍕',.28],['Quality check','Cut, boxed and ready for the driver','✅',.5],['Out for delivery','Your driver is on the way','🛵',.6],['Delivered','Enjoy your pizza!','🎉',1]];
const PROMOS={PIZZA10:'10% off your pizza',SAVE5:'$5 off your pizza',FREEDEL:'free delivery'};
const fresh=()=>({preset:0,size:1,crust:0,tops:[],cheese:false,qty:1,notes:''});
let S={step:0,max:0,user:null,rest:0,pz:fresh(),dl:{name:'',phone:'',street:'',apt:'',city:'',postal:'',when:'As soon as possible',door:false,instr:''},pay:{m:0,holder:'',card:'',exp:'',cvv:'',pp:'',gift:'',change:''},tip:2,promo:'',order:null};
let timer=null;
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',3200)}
const unit=()=>{const p=S.pz;return SIZES[p.size][1]+CRUSTS[p.crust][1]+p.tops.length*1.25+(p.cheese?1.5:0)};
function totals(){const sub=unit()*S.pz.qty,r=REST[S.rest];let disc=0,del=r.f;if(S.promo=='PIZZA10')disc=sub*.1;else if(S.promo=='SAVE5')disc=Math.min(5,sub);else if(S.promo=='FREEDEL')del=0;const tax=(sub-disc+del)*.13,tip=(sub-disc)*TIPS[S.tip]/100;return{sub,disc,del,tax,tip,total:sub-disc+del+tax+tip}}
const pizzaName=()=>S.pz.preset>0?PRE[S.pz.preset][1]:'Custom pizza';
const itemsHtml=()=>`<b>${S.pz.qty} × ${pizzaName()}</b> — ${SIZES[S.pz.size][0]}, ${CRUSTS[S.pz.crust][0]} crust<br>Toppings: ${S.pz.tops.join(', ')||'none'}${S.pz.cheese?' + extra cheese':''}${S.pz.notes?`<br><i>“${esc(S.pz.notes)}”</i>`:''}`;
const luhn=d=>{let s=0,b=false;for(let i=d.length-1;i>=0;i--){let n=+d[i];if(b){n*=2;if(n>9)n-=9}s+=n;b=!b}return s%10==0};
const brand=d=>d[0]=='4'?'Visa':/^(5[1-5]|2[2-7])/.test(d)?'Mastercard':/^3[47]/.test(d)?'Amex':'';
const payText=()=>{const p=S.pay;return[()=>{const d=p.card.replace(/\D/g,'');return(brand(d)||'Card')+' **** '+d.slice(-4)},()=>'Apple Pay',()=>'Google Pay',()=>'PayPal ('+p.pp+')',()=>'Cash on delivery'+(p.change?' (bill of $'+p.change+')':''),()=>'Gift card ••••'+p.gift.replace(/\W/g,'').slice(-4)][p.m]()};
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const acc=()=>{try{return JSON.parse(localStorage.getItem('pg_acc')||'{}')}catch(e){return{}}};
const saveAcc=a=>{try{localStorage.setItem('pg_acc',JSON.stringify(a))}catch(e){}};
const validEmail=e=>/^[^\s@]+@[^\s@]+\.[A-Za-z]{2,}$/.test(e);
const err=(m)=>{const e=$('#err');if(e){e.textContent=m||'';e.style.display=m?'block':'none'}return !m};
function go(n){if(n>S.max+0&&n>S.step)return;if(S.order&&S.order.active&&n<6&&!confirm('Are you sure you want to cancel the order?'))return;if(S.order&&n<6){clearInterval(timer);S.order=null}S.step=n;S.max=Math.max(S.max,n);render();scrollTo({top:0,behavior:'smooth'})}
function next(n){S.max=Math.max(S.max,n);S.step=n;render();scrollTo({top:0,behavior:'smooth'})}
function railHtml(){const all=S.order;return STEPS.map((s,i)=>`<div class="st ${all||i<S.step?'done':''} ${i==S.step&&!all?'cur':''} ${i==S.step&&all?'cur':''}"><div class="dot" ${i<=S.max?`onclick="go(${i})"`:''}>${all||i<S.step?'✓':i+1}</div><div><b>${s[0]}</b><small>${s[1]}</small></div></div>`).join('')}
function head(t,s){return`<h1>${t}</h1><p class="sub">${s}</p>`}
function nav(back,label,fn){return`<div class="nav">${back!=null?`<button onclick="go(${back})">← Back</button>`:'<span></span>'}<button class="pri" onclick="${fn}">${label}</button></div>`}
function fld(l,id,v,ph,t){return`<div class="fld"><label class="f" for="${id}">${l}</label><input id="${id}" type="${t||'text'}" value="${esc(v||'')}" placeholder="${ph||''}"></div>`}
/* ---------- steps ---------- */
function vSign(){const a=S.mode||'login';return`<div class="row"><div class="hero"><svg width="64" height="64" viewBox="0 0 40 40"><rect width="40" height="40" rx="10" fill="#fff" opacity=".2"/><path d="M9 13h22L20 34z" fill="#FFD54F"/><rect x="7" y="9" width="26" height="5" rx="2.5" fill="#E6A23C"/><circle cx="16.5" cy="19" r="2.2" fill="#E53935"/><circle cx="23.5" cy="19" r="2.2" fill="#E53935"/></svg><h2>PizzaGo</h2><p>Hot, fresh pizza — tracked all the way to your door.</p><br><p>📍 Find the closest restaurant on the map</p><p>🍕 Build your pizza your way</p><p>💳 Card, wallets, PayPal or cash</p><p>🛵 Live order tracking</p></div>
<div style="flex:3 1 380px">${head('👋 Welcome!','Log in or create an account to save your details — or just continue as a guest.')}
<div class="seg" style="margin-bottom:14px"><button class="${a=='login'?'on':''}" onclick="S.mode='login';render()">Log in</button><button class="${a=='reg'?'on':''}" onclick="S.mode='reg';render()">Create account</button></div>
<div class="card">${a=='login'?`${fld('Email','le','','you@example.com','email')}${fld('Password','lp','','Your password','password')}<div style="display:flex;justify-content:space-between"><label class="chk"><input type="checkbox" id="rm"> Remember me</label><button class="link" onclick="toast('Demo: a reset link would be emailed.')">Forgot password?</button></div><div class="err" id="err"></div><button class="pri" style="width:100%" onclick="login()">Log in →</button>`:`${fld('Full name','rn','','Your full name')}${fld('Email','re','','you@example.com','email')}${fld('Password','rp','','At least 8 characters','password')}<div class="note" id="str"></div>${fld('Confirm password','rp2','','Repeat your password','password')}<label class="chk"><input type="checkbox" id="tc"> I agree to the Terms &amp; Privacy Policy</label><div class="err" id="err"></div><button class="pri" style="width:100%" onclick="register()">Create account →</button>`}
<p class="note" style="text-align:center;margin:16px 0 8px">— or continue with —</p><div class="g2"><button onclick="toast('Demo: this would open Google sign-in (OAuth).')">G Google</button><button onclick="toast('Demo: this would open Apple sign-in.')">🍎 Apple</button></div></div>
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span class="note">In a hurry? You don’t need an account to order.</span><button onclick="S.user={name:'Guest',guest:true};next(1)">Continue as guest →</button></div></div></div>`}
async function login(){const em=$('#le').value.trim().toLowerCase(),pw=$('#lp').value,A=acc();if(!validEmail(em))return err('Enter a valid email address.');if(!pw)return err('Enter your password.');const u=A[em];if(!u)return err('No account found for that email — use “Create account” or continue as a guest.');if(await sha(u.salt+pw)!=u.hash)return err('Incorrect password.');S.user={name:u.name,guest:false};if(!S.dl.name)S.dl.name=u.name;next(1)}
async function register(){const n=$('#rn').value.trim(),em=$('#re').value.trim().toLowerCase(),p=$('#rp').value,A=acc();let m='';if(!n)m='Please enter your name.';else if(!validEmail(em))m='Enter a valid email address.';else if(p.length<8)m='Password must be at least 8 characters.';else if(p!=$('#rp2').value)m='Passwords do not match.';else if(!$('#tc').checked)m='Please accept the Terms & Privacy Policy.';else if(A[em])m='An account with that email already exists — try logging in.';if(!err(m))return;const salt=crypto.randomUUID();A[em]={name:n,salt,hash:await sha(salt+p)};saveAcc(A);S.user={name:n,guest:false};if(!S.dl.name)S.dl.name=n;next(1)}
function vRest(){const pins=REST.map((r,i)=>`<g class="pin" transform="translate(${r.x},${r.y})" onclick="S.rest=${i};render()"><ellipse cy="0" rx="8" ry="3" fill="#0003"/><path d="M0 0L-9-11A13 13 0 1 1 9-11z" transform="scale(${i==S.rest?1.3:1})" fill="${i==S.rest?'#2196F3':'#4CAF50'}" stroke="#fff" stroke-width="2"/><circle cy="-${i==S.rest?24:18}" r="5" fill="#fff"/>${i==S.rest?`<text y="-52" text-anchor="middle" font-weight="700" font-size="13" fill="#1b2733" stroke="#fff" stroke-width="5" paint-order="stroke">${esc(r.n.split(' — ')[0])}</text>`:''}</g>`).join('');
const r=REST[S.rest];return head('📍 Choose a restaurant','Tap a pin on the map or pick from the list. Distances are measured from your location.')+`<div class="row"><div style="flex:2 1 300px">${REST.map((x,i)=>`<div class="rest ${i==S.rest?'on':''}" onclick="S.rest=${i};render()"><i>🍕</i><div><b>${esc(x.n)}</b><br><span class="note">${x.km} km • ★ ${x.r} • ${x.h}</span></div></div>`).join('')}</div>
<div style="flex:3 1 380px"><svg class="map" viewBox="0 0 600 420"><rect width="600" height="420" fill="var(--map)"/><g fill="#cde7cd"><rect x="40" y="130" width="70" height="80" rx="10"/><rect x="460" y="20" width="60" height="70" rx="10"/><rect x="300" y="340" width="100" height="60" rx="10"/></g><path d="M250 0C290 70 220 120 260 190S230 300 280 420" fill="none" stroke="#b9d7ee" stroke-width="16" stroke-linecap="round"/><g stroke="#fff" stroke-width="2">${[...Array(12)].map((_,i)=>`<line x1="${i*55}" y1="0" x2="${i*55}" y2="420"/>`).join('')}${[...Array(9)].map((_,i)=>`<line x1="0" y1="${i*50}" x2="600" y2="${i*50}"/>`).join('')}</g><path d="M520 0L545 420" stroke="#f4d58d" stroke-width="10"/><g stroke="#c9d2da" stroke-width="12"><line x1="420" y1="0" x2="420" y2="420"/><line x1="150" y1="0" x2="150" y2="420"/><line x1="0" y1="330" x2="600" y2="330"/><line x1="0" y1="190" x2="600" y2="190"/></g><g stroke="#fff" stroke-width="8"><line x1="420" y1="0" x2="420" y2="420"/><line x1="150" y1="0" x2="150" y2="420"/><line x1="0" y1="330" x2="600" y2="330"/><line x1="0" y1="190" x2="600" y2="190"/></g><g font-size="11" font-weight="700" fill="#7d8a96"><text x="430" y="40">Don Mills Rd</text><text x="160" y="40">Leslie St</text><text x="10" y="322">Sheppard Ave E</text><text x="10" y="182">Finch Ave E</text></g><circle cx="285" cy="285" r="20" fill="#1565C033"/><circle cx="285" cy="285" r="9" fill="#fff"/><circle cx="285" cy="285" r="6.5" fill="#1565C0"/><text x="285" y="312" text-anchor="middle" font-size="12" fill="#1565C0">You</text>${pins}</svg><p class="note" style="margin:6px 2px">Demo map (stylised, works offline).</p></div></div>
<div class="card" style="margin-top:20px"><h3>Selected restaurant</h3><b style="font-size:16px">${esc(r.n)}</b><br>${esc(r.a)}<br><span class="ok">${r.h}</span> • ★ ${r.r} • ${r.km} km away • ~${r.e} min • Delivery ${money(r.f)}</div>`+nav(null,'Continue →','next(2)')}
function vPizza(){const p=S.pz;return head('Build your pizza 🍕','Start with a favourite or make it your own.')+`<div class="card"><h3>Popular pizzas</h3><div class="g3">${PRE.map((x,i)=>`<button class="opt ${p.preset==i?'on':''}" onclick="preset(${i})">${x[0]} ${x[1]}<small>${x[2]}</small></button>`).join('')}</div></div><div style="height:16px"></div>
<div class="card"><h3>Size &amp; crust</h3><p class="note" style="margin:0 0 6px">Size</p><div class="seg">${SIZES.map((s,i)=>`<button class="${p.size==i?'on':''}" onclick="S.pz.size=${i};render()">${s[0]} · ${money(s[1])}</button>`).join('')}</div><p class="note" style="margin:14px 0 6px">Crust</p><div class="seg">${CRUSTS.map((s,i)=>`<button class="${p.crust==i?'on':''}" onclick="S.pz.crust=${i};render()">${s[0]}${s[1]?` (+${money(s[1])})`:''}</button>`).join('')}</div>
<div style="display:flex;align-items:center;gap:10px;margin-top:16px">Quantity <button onclick="S.pz.qty=Math.max(1,S.pz.qty-1);render()">−</button><b>${p.qty}</b><button onclick="S.pz.qty=Math.min(10,S.pz.qty+1);render()">+</button><span style="flex:1"></span><button onclick="S.pz=fresh();render()">Reset pizza ⟳</button></div></div>
<div class="card"><h3>Toppings · $1.25 each</h3><div class="g3">${TOPS.map(t=>`<label class="chk"><input type="checkbox" ${p.tops.includes(t[0])?'checked':''} onchange="togTop('${t[0]}')"> ${t[1]} ${t[0]}</label>`).join('')}<label class="chk"><input type="checkbox" ${p.cheese?'checked':''} onchange="S.pz.preset=-1;S.pz.cheese=this.checked;render()"> 🧀 Extra Cheese (+$1.50)</label></div></div>
<div class="card"><h3>Your pizza</h3><b style="font-size:15px">${pizzaName()}</b><br>${SIZES[p.size][0]} · ${CRUSTS[p.crust][0]} crust · Qty ${p.qty}<br>Toppings: ${p.tops.join(', ')||'None'}${p.cheese?' + extra cheese':''}<div class="ok" style="font-size:17px;margin:8px 0">Subtotal: ${money(unit()*p.qty)}</div><input placeholder="Special instructions (optional)" value="${esc(p.notes)}" oninput="S.pz.notes=this.value"></div>`+nav(1,'Continue →','next(3)')}
function preset(i){S.pz.preset=i;S.pz.tops=[...PRE[i][3]];S.pz.cheese=false;render()}
function togTop(n){const t=S.pz.tops;S.pz.preset=-1;t.includes(n)?t.splice(t.indexOf(n),1):t.push(n);render()}
function vDel(){const d=S.dl,b=(k,id,l,ph)=>`<div class="fld"><label class="f">${l}</label><input value="${esc(d[k])}" placeholder="${ph}" oninput="S.dl.${k}=this.value"></div>`;return head('Delivery details 🏠','Almost done — where should the driver go?')+`<div class="card"><h3>Where to?</h3><div class="g2">${b('name','','Name','Your full name')}${b('phone','','Phone','(416) 555-0123')}${b('street','','Street','Street address')}${b('apt','','Apartment','Apt / unit / buzzer (optional)')}${b('city','','City','City')}${b('postal','','Postal code','A1A 1A1')}</div></div><div class="card"><h3>Delivery options</h3><div class="fld"><label class="f">When</label><select onchange="S.dl.when=this.value">${['As soon as possible','In about 1 hour','In about 2 hours','Tonight at 7:00 PM'].map(w=>`<option ${d.when==w?'selected':''}>${w}</option>`).join('')}</select></div><label class="chk"><input type="checkbox" ${d.door?'checked':''} onchange="S.dl.door=this.checked"> 🚪 Contactless — leave at the door</label><input placeholder="Delivery instructions (optional)" value="${esc(d.instr)}" oninput="S.dl.instr=this.value"></div><div class="err" id="err"></div>`+nav(2,'Continue to payment →','delNext()')}
function delNext(){const d=S.dl;let m='';if(!d.name.trim())m='Please enter your name.';else if(d.phone.replace(/\D/g,'').length<10)m='Please enter a phone number the driver can call (10 digits).';else if(!d.street.trim())m='Please enter your street address.';else if(!d.city.trim())m='Please enter your city.';else if(!/^[A-Za-z]\d[A-Za-z] ?\d[A-Za-z]\d$/.test(d.postal.trim()))m='Postal code should look like A1A 1A1.';if(err(m))next(4)}
function vPay(){const p=S.pay,m=p.m;let body='';if(m==0)body=`<div class="fld"><label class="f">Card holder</label><input value="${esc(p.holder)}" placeholder="Name on card" oninput="S.pay.holder=this.value"></div><div class="fld"><label class="f">Card number <span id="br" style="color:var(--blue2)">${brand(p.card.replace(/\D/g,''))}</span></label><input inputmode="numeric" value="${esc(p.card)}" placeholder="1234 5678 9012 3456" oninput="fmtCard(this)"></div><div class="g2"><div class="fld"><label class="f">Expiry</label><input inputmode="numeric" value="${esc(p.exp)}" placeholder="MM/YY" oninput="fmtExp(this)"></div><div class="fld"><label class="f">CVV</label><input type="password" inputmode="numeric" maxlength="4" value="${esc(p.cvv)}" placeholder="123" oninput="S.pay.cvv=this.value.replace(/\\D/g,'')"></div></div>`;else if(m<3&&m>0)body=`<div class="card" style="background:var(--soft)">You’ll confirm the payment with ${m==1?'Apple Pay (Face ID / Touch ID)':'Google Pay'} when you place the order.</div>`;else if(m==3)body=`<div class="fld"><label class="f">PayPal account</label><input value="${esc(p.pp)}" placeholder="PayPal email" oninput="S.pay.pp=this.value"></div>`;else if(m==4)body=`<div class="card" style="background:var(--soft)">Pay your driver in cash when the pizza arrives.</div><div class="fld"><label class="f">Paying with a bill of</label><input value="${esc(p.change)}" placeholder="e.g. 50 (optional)" oninput="S.pay.change=this.value"></div>`;else body=`<div class="fld"><label class="f">Gift card code</label><input value="${esc(p.gift)}" placeholder="8+ letters / digits" oninput="S.pay.gift=this.value"></div>`;
return head('Payment 💳','Choose how you’d like to pay. All transactions are encrypted.')+`<div class="card"><h3>Payment method</h3><div class="g3" style="margin-bottom:16px">${PAY.map((x,i)=>`<button class="opt ${m==i?'on':''}" style="min-height:56px;text-align:center" onclick="S.pay.m=${i};render()">${x}</button>`).join('')}</div>${body}</div><div class="card"><h3>Tip your driver</h3><div class="seg">${TIPS.map((t,i)=>`<button class="${S.tip==i?'on':''}" onclick="S.tip=${i};render()">${t?t+'%':'No tip'}</button>`).join('')}</div></div><div class="err" id="err"></div>`+nav(3,'Review order →','payNext()')}
function fmtCard(el){let d=el.value.replace(/\D/g,''),b=brand(d);d=d.slice(0,b=='Amex'?15:16);let o='';[...d].forEach((c,i)=>{if(b=='Amex'?(i==4||i==10):(i&&i%4==0))o+=' ';o+=c});el.value=o;S.pay.card=o;const e=$('#br');if(e)e.textContent=b}
function fmtExp(el){let d=el.value.replace(/\D/g,'').slice(0,4);if(d.length>=2){const m=+d.slice(0,2);if(m<1||m>12)d=d.slice(0,1)+d.slice(2)}if(d.length==4){const m=+d.slice(0,2),y=2000+ +d.slice(2),n=new Date();if(y<n.getFullYear()||(y==n.getFullYear()&&m<n.getMonth()+1)||y>n.getFullYear()+10)d=d.slice(0,2)}el.value=d.length>2?d.slice(0,2)+'/'+d.slice(2):d;S.pay.exp=el.value}
function payNext(){const p=S.pay;let m='';if(p.m==0){const d=p.card.replace(/\D/g,'');if(!p.holder.trim())m='Card holder is required.';else if(d.length!=(brand(d)=='Amex'?15:16)||!luhn(d))m='That card number doesn’t look valid.';else if(!/^\d\d\/\d\d$/.test(p.exp))m='Expiry must be MM/YY.';else if(p.cvv.length<3)m='CVV must be 3–4 digits.'}else if(p.m==3&&!validEmail(p.pp.trim()))m='Enter the email of your PayPal account.';else if(p.m==5&&p.gift.replace(/\W/g,'').length<8)m='Gift card codes have at least 8 letters or digits.';if(err(m))next(5)}
function vReview(){const t=totals(),d=S.dl,r=REST[S.rest],row=(a,b,s='')=>`<tr style="${s}"><td>${a}</td><td>${b}</td></tr>`;return head('Confirm your order 🛒','Check everything below, add a promo code if you have one, then place your order.')+`<div class="card"><h3>Summary</h3><b>Restaurant:</b> ${esc(r.n)}<hr style="border:0;border-top:1px solid var(--line)">${itemsHtml()}<hr style="border:0;border-top:1px solid var(--line)"><b>Recipient:</b> ${esc(d.name)} (${esc(d.phone)})<br><b>Address:</b> ${esc(d.street)}${d.apt?', '+esc(d.apt):''}, ${esc(d.city)} ${esc(d.postal.toUpperCase())}<br><b>When:</b> ${d.when}<br>${d.door||d.instr?`<b>Notes:</b> ${[d.door?'Contactless drop-off':'',esc(d.instr)].filter(Boolean).join(' — ')}<br>`:''}<b>Payment:</b> ${esc(payText())}<hr style="border:0;border-top:1px solid var(--line)"><table>${row('Subtotal',money(t.sub))}${t.disc?row('Discount ('+S.promo+')','−'+money(t.disc),'color:#2e7d32'):''}${row('Delivery fee',t.del?money(t.del):'Free')}${row('HST (13%)',money(t.tax))}${t.tip?row('Driver tip ('+TIPS[S.tip]+'%)',money(t.tip)):''}${row('Total',money(t.total),'font-size:17px;font-weight:700;color:#2e7d32')}</table></div>
<div class="card"><h3>Promo code</h3><div style="display:flex;gap:10px"><input id="pc" value="${esc(S.promo)}" placeholder="Try PIZZA10, SAVE5 or FREEDEL"><button onclick="promo()">Apply</button></div><p id="ps" class="note" style="margin:8px 0 0">${S.promo?'✔ '+S.promo+' applied — '+PROMOS[S.promo]:''}</p></div>`+nav(4,'Place order ✔','place()')}
function promo(){const c=$('#pc').value.trim().toUpperCase();if(!c){S.promo=''}else if(PROMOS[c])S.promo=c;else{S.promo='';render();$('#ps').textContent='Sorry, that code isn’t valid.';$('#ps').style.color='var(--red)';return}render()}
function place(){const t=totals(),r=REST[S.rest];S.order={no:'PG-'+(10000+Math.floor(Math.random()*89999)),t0:Date.now(),total:t.total,eta:r.e,active:true,reached:-1,times:[]};S.step=6;S.max=6;render();scrollTo({top:0})}
const TOTAL=50000;
function vTrack(){const o=S.order,r=REST[S.rest],d=S.dl;return`<h1 id="hl">Order placed ✔</h1><p class="sub">Order <b>#${o.no}</b> · ${esc(r.n)}</p><div class="card"><div class="eta" id="eta"></div><p class="sub" id="stt" style="margin:4px 0 12px"></p><div class="bar"><i id="bar"></i></div></div><div class="row"><div><div class="card"><h3>Order status</h3>${STAGES.map((s,i)=>`<div class="tl" id="tl${i}"><div class="d"></div><div style="flex:1"><b>${s[0]}</b><small>${s[1]}</small></div><small id="tm${i}"></small></div>`).join('')}</div><div class="card"><h3>Order details</h3>${itemsHtml()}<hr style="border:0;border-top:1px solid var(--line)"><b>Restaurant:</b> ${esc(r.n)}<br><b>Deliver to:</b> ${esc(d.street)}, ${esc(d.city)} ${esc(d.postal.toUpperCase())}<br><b>When:</b> ${d.when}<br><b>Payment:</b> ${esc(payText())}<br><span class="ok" style="font-size:16px">Total: ${money(o.total)}</span></div></div>
<div><div class="card"><h3>Live tracking</h3><svg class="map" viewBox="0 0 420 260"><rect width="420" height="260" fill="var(--map)"/><g stroke="#fff" stroke-width="3">${[30,100,170,240,310,380].map(x=>`<line x1="${x}" y1="0" x2="${x}" y2="260"/>`).join('')}${[25,85,145,205].map(y=>`<line x1="0" y1="${y}" x2="420" y2="${y}"/>`).join('')}</g><rect x="176" y="150" width="84" height="72" rx="10" fill="#cde7cd"/><path id="rt" d="M46 216C118 13 252 247 374 44" fill="none" stroke="#9fb3c5" stroke-width="4" stroke-dasharray="8 7" stroke-linecap="round"/><path id="rd" d="M46 216C118 13 252 247 374 44" fill="none" stroke="#2196F3" stroke-width="5" stroke-linecap="round"/><g font-size="16" text-anchor="middle"><circle cx="46" cy="216" r="19" fill="#E53935" stroke="#fff" stroke-width="3"/><text x="46" y="222">🍕</text><circle cx="374" cy="44" r="19" fill="#4CAF50" stroke="#fff" stroke-width="3"/><text x="374" y="50">🏠</text><g id="sc"><circle r="17" fill="#2196F3" stroke="#fff" stroke-width="3"/><text y="6">🛵</text></g></g></svg></div><div class="card"><h3>Your driver</h3><div id="drv"></div><button id="ct" style="margin-top:10px" onclick="toast('Demo: this would call or message your driver.')">📞 Contact driver</button></div><div class="card" id="rate" style="display:none"><h3>How was your order?</h3>${[0,1,2,3,4].map(i=>`<button class="star" onclick="document.querySelectorAll('.star').forEach((b,j)=>b.textContent=j<=${i}?'★':'☆')">☆</button>`).join('')}</div></div></div>
<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><button class="danger" id="cx" onclick="cancelOrder()">Cancel order</button><span class="note" id="cxn" style="flex:1"></span><button class="pri" id="nw" style="display:none" onclick="newOrder()">Start a new order →</button></div>`}
function tick(){const o=S.order;if(!o)return;const p=Math.min(1,(Date.now()-o.t0)/TOTAL);let st=0;STAGES.forEach((s,i)=>{if(p>=s[3])st=i});for(let i=o.reached+1;i<=st;i++)o.times[i]=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});o.reached=st;
STAGES.forEach((s,i)=>{const done=i<st||p>=1,cur=i==st&&p<1,el=$('#tl'+i);if(!el)return;el.className='tl '+(done?'done':cur?'cur':'');el.firstChild.textContent=done?'✓':cur?s[2]:i+1;$('#tm'+i).textContent=o.times[i]||''});
$('#bar').style.width=p*100+'%';$('#eta').textContent=p>=1?'Delivered — enjoy! 🍕':`Arriving in ${Math.ceil(o.eta*(1-p))} min`;$('#stt').textContent=p>=1?'Thanks for ordering with PizzaGo. Rate your order below.':STAGES[st][2]+'  '+STAGES[st][0];
const N=['Marco R.','Aisha K.','Daniel L.','Priya S.','Chen W.'],V=['Red scooter','Blue e-bike','Silver Honda Fit','White scooter','Green e-bike'],k=parseInt(o.no.slice(3))%5;$('#drv').innerHTML=st>=3?`<span style="font-size:16px"><b>${N[k]}</b></span> ★ 4.9<br>${V[k]} · plate PZ-${4000+k*137}`:'<i>Finding the nearest driver…</i>';$('#ct').disabled=!(st>=3&&p<1);
const rp=Math.max(0,Math.min(1,(p-.6)/.4)),path=$('#rt'),L=path.getTotalLength(),pt=path.getPointAtLength(L*rp);$('#sc').setAttribute('transform',`translate(${pt.x},${pt.y})`);$('#rd').style.strokeDasharray=`${L*rp} ${L}`;
const can=p<.6&&p<1;$('#cx').disabled=!can;$('#cxn').textContent=p>=1?'':can?'Cancel before the driver picks it up and you won’t be charged.':'Your order is on its way and can no longer be cancelled.';
if(p>=1){clearInterval(timer);o.active=false;$('#hl').textContent='Delivered ✔';$('#cx').style.display='none';$('#rate').style.display='block';$('#nw').style.display='';}}
function cancelOrder(){if(!confirm('Cancel your order? You won’t be charged, and your pizza, delivery and payment details will be cleared.'))return;newOrder()}
function newOrder(){clearInterval(timer);S.order=null;S.pz=fresh();S.pay={m:0,holder:'',card:'',exp:'',cvv:'',pp:'',gift:'',change:''};S.tip=2;S.promo='';const n=S.user&&!S.user.guest?S.user.name:'';S.dl={name:n,phone:'',street:'',apt:'',city:'',postal:'',when:'As soon as possible',door:false,instr:''};S.step=1;S.max=1;render();scrollTo({top:0})}
function render(){$('#rail').innerHTML=railHtml();const u=S.user;$('#acct').innerHTML=`<b>👤 ${u?esc(u.name):'Guest'}</b><br><button style="margin-top:8px;width:100%;padding:8px" onclick="${u&&!u.guest?"S.user=null;S.mode='login';S.step=0;S.order&&clearInterval(timer);S.order=null;render()":'go(0)'}">${u&&!u.guest?'Sign out':'Log in / Sign up'}</button>`;
$('#view').innerHTML=[vSign,vRest,vPizza,vDel,vPay,vReview,vTrack][S.step]();if(S.step==6&&S.order){clearInterval(timer);timer=setInterval(tick,100);tick()}
const pw=$('#rp');if(pw)pw.oninput=()=>{const v=pw.value;let s=(v.length>=8)+(/[a-z]/.test(v)&&/[A-Z]/.test(v))+/\d/.test(v)+/[^A-Za-z0-9]/.test(v);$('#str').innerHTML=v?'Password strength: <b>'+['Weak','Weak','Okay','Good','Strong'][s]+'</b>':''}}
render();
</script></body></html>
